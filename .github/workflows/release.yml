name: Release

on:
  push:
    branches: ["main"]
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

# Пуш в main (и тег / ручной запуск) пересобирает мод и обновляет
# GitHub Release для текущей mod_version: те же jar перезаписываются.
# Новый номер версии в gradle.properties → новый релиз vX.Y.Z.
# SHA-256 у каждого файла считает сам GitHub при загрузке.

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read versions from gradle.properties
        id: versions
        run: |
          set -euo pipefail
          mod_version="$(grep -E '^mod_version=' gradle.properties | cut -d= -f2- | tr -d '\r')"
          kff_version="$(grep -E '^kff_version=' gradle.properties | cut -d= -f2- | tr -d '\r')"
          sodium_modrinth_version="$(grep -E '^sodium_modrinth_version=' gradle.properties | cut -d= -f2- | tr -d '\r')"
          echo "mod_version=${mod_version}" >> "$GITHUB_OUTPUT"
          echo "kff_version=${kff_version}" >> "$GITHUB_OUTPUT"
          echo "sodium_modrinth_version=${sodium_modrinth_version}" >> "$GITHUB_OUTPUT"
          echo "mod_version=${mod_version}" >> "$GITHUB_ENV"

      - name: Check tag matches mod_version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          expected="v${{ steps.versions.outputs.mod_version }}"
          actual="${GITHUB_REF_NAME}"
          if [[ "${actual}" != "${expected}" ]]; then
            echo "Tag ${actual} must be ${expected} (mod_version in gradle.properties)."
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Build and test
        run: gradle build --stacktrace

      - name: Collect release jars
        run: |
          set -euo pipefail
          mkdir -p release-assets
          shopt -s nullglob
          jars=(build/libs/culllessleaves-*.jar)
          if [[ ${#jars[@]} -eq 0 ]]; then
            echo "No culllessleaves jar in build/libs"
            exit 1
          fi
          for jar in "${jars[@]}"; do
            case "${jar}" in
              *-sources.jar|*-javadoc.jar) continue ;;
              *) cp -v "${jar}" release-assets/ ;;
            esac
          done
          test -f "release-assets/culllessleaves-neoforge-1.21.1-${{ steps.versions.outputs.mod_version }}.jar"
          chmod +x .github/scripts/fetch-companion-jars.sh
          .github/scripts/fetch-companion-jars.sh \
            release-assets \
            "${{ steps.versions.outputs.kff_version }}" \
            "${{ steps.versions.outputs.sodium_modrinth_version }}"
          find release-assets -name 'kotlinforforge-*.jar' | grep -q .
          find release-assets -name 'sodium-neoforge-*.jar' | grep -q .
          ls -lh release-assets

      - name: Publish split GitHub releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LEGACY_TAG: v${{ steps.versions.outputs.mod_version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          shopt -s nullglob
          rm -rf release-split
          dir="release-split/minecraft-1.21.1-neoforge"
          mkdir -p "${dir}"
          printf '%s\n' "cull less leaves for minecraft 1.21.1 neoforge" > "${dir}/title.txt"
          cat > "${dir}/body.md" <<'EOF'
          Minecraft **1.21.1** / NeoForge. Client-side only. Put the jars you need into the `mods` folder.

          | File | Required | Source | License |
          | --- | --- | --- | --- |
          | `culllessleaves-neoforge-1.21.1-${{ steps.versions.outputs.mod_version }}.jar` | Yes | this mod | LGPL-3.0-only, port of [Cull Less Leaves](https://github.com/isXander/CullLessLeaves) by isXander |
          | `kotlinforforge-${{ steps.versions.outputs.kff_version }}-all.jar` | Yes | [Kotlin for Forge](https://modrinth.com/mod/kotlin-for-forge) | LGPL-2.1 |
          | `sodium-neoforge-*.jar` | No | [Sodium](https://modrinth.com/mod/sodium) | Polyform Shield 1.0.0 |

          Sodium is optional. The file in this release is `0.6.13+mc1.21.1`; any newer NeoForge 1.21.1 build, including 0.8.x, also works. Skip it if Sodium is already installed. Do not install `*-sources.jar`. Companion jars are official Modrinth builds. GitHub shows a SHA-256 digest next to each uploaded file. `all-jars.zip` contains every jar on this page.
          EOF
          cp -v release-assets/culllessleaves-*.jar release-assets/kotlinforforge-*.jar release-assets/sodium-neoforge-*.jar "${dir}/"
          python3 .github/scripts/publish-split-releases.py release-split

      - name: Check Modrinth token
        id: modrinth_token
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${MODRINTH_TOKEN}" ]]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "MODRINTH_TOKEN is empty. Modrinth publish will be skipped."
            exit 0
          fi
          echo "present=true" >> "$GITHUB_OUTPUT"

      - name: Replace Modrinth versions
        if: steps.modrinth_token.outputs.present == 'true'
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          set -euo pipefail
          python3 .github/scripts/replace-modrinth-versions.py \
            cull-less-leaves-for-neoforge \
            "${{ steps.versions.outputs.mod_version }}"

      - name: Publish Modrinth
        if: steps.modrinth_token.outputs.present == 'true'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: cull-less-leaves-for-neoforge
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-featured: true
          name: ${{ steps.versions.outputs.mod_version }}
          version: ${{ steps.versions.outputs.mod_version }}
          version-type: release
          changelog: |
            Minecraft 1.21.1 / NeoForge. Cull Less Leaves ${{ steps.versions.outputs.mod_version }}.
          loaders: |
            neoforge
          environment: |
            client
          game-versions: |
            1.21.1
          java: |
            21
          files: release-assets/culllessleaves-neoforge-1.21.1-${{ steps.versions.outputs.mod_version }}.jar
          dependencies: |
            kotlin-for-forge(required){modrinth:ordsPcFz}
            sodium(optional){modrinth:AANobbMI}

      - name: Delete replaced Modrinth versions
        if: steps.modrinth_token.outputs.present == 'true'
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          set -euo pipefail
          python3 .github/scripts/replace-modrinth-versions.py --finish release-assets/modrinth-delete-after-publish.txt

      - name: Update Modrinth description
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${MODRINTH_TOKEN}" ]]; then
            echo "MODRINTH_TOKEN is empty. The Modrinth page will not be updated."
            exit 0
          fi
          python3 .github/scripts/update-modrinth-body.py cull-less-leaves-for-neoforge modrinth.md

      - name: Set up Node.js
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Publish jars to McnCDN
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        env:
          MCNS_WORKER_ID: ${{ secrets.MCNS_WORKER_ID }}
          MCNS_WORKER_KEY: ${{ secrets.MCNS_WORKER_KEY }}
          MCNS_MOD_VERSION: ${{ steps.versions.outputs.mod_version }}
          MCNS_COMMIT: ${{ github.sha }}
          MCNS_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          one() {
            local pattern="$1"
            shopt -s nullglob
            local matches=( $pattern )
            if [[ ${#matches[@]} -ne 1 ]]; then
              echo "Expected exactly one file for ${pattern}, found ${#matches[@]}: ${matches[*]}" >&2
              exit 1
            fi
            printf '%s\n' "${matches[0]}"
          }
          mod_jar="$(one 'release-assets/culllessleaves-neoforge-1.21.1-*.jar')"
          kff_jar="$(one 'release-assets/kotlinforforge-*.jar')"
          sodium_jar="$(one 'release-assets/sodium-neoforge-*.jar')"
          node scripts/mcns-release.mjs cull-less-leaves-for-neoforge auto \
            "mod=${mod_jar}" \
            "kotlinforforge=${kff_jar}" \
            "sodium=${sodium_jar}"
