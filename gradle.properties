# ============================================================
# Настройки Gradle
# ============================================================
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

kotlin.code.style=official

# ============================================================
# Parchment-маппинги
# ============================================================
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# ============================================================
# Minecraft / NeoForge
# ============================================================
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.209
loader_version_range=[1,)

# ============================================================
# Kotlin for Forge — https://modrinth.com/mod/kotlin-for-forge
# ============================================================
kotlin_version=2.1.20
kff_version=5.8.0
kff_version_range=[5.8,)

# Sodium — версия внутри jar sodium-neoforge-0.6.13+mc1.21.1.
# Тот же вызов skipRendering есть и в 0.8.13+mc1.21.1, поэтому диапазон открыт сверху.
sodium_version=0.6.13+mc1.21.1
sodium_version_range=[0.6.13+mc1.21.1,)

# ============================================================
# Метаданные мода
# ============================================================
mod_id=culllessleaves
mod_name=Cull Less Leaves
mod_license=LGPL-3.0-only
mod_version=1.4.2
mod_group_id=com.culllessleaves.mod
mod_authors=Nergan, isXander
mod_description=Cull inner leaf layers while keeping the outer ones. NeoForge port of isXander's Cull Less Leaves.
